name: Refresh crowd feed

# Pulls live station busyness and commits crowd.json so GitHub Pages serves fresh data.
# GitHub throttles scheduled runs (expect ~every 5-15 min in practice).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to commit the refreshed feed

concurrency:
  group: refresh-crowd
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Free trial path: populartimes (scrapes Google Live Busyness). Needs only a
      # Google Maps API key. To switch to the more reliable paid backend later,
      # `pip install requests`, use `--backend besttime`, and set BESTTIME_KEY_PRIVATE.
      - run: pip install requests "git+https://github.com/m-wrzr/populartimes"

      - name: Collect live busyness
        env:
          GMAPS_KEY: ${{ secrets.GMAPS_KEY }}
        run: |
          python crowd-live/collect_crowd.py --backend populartimes
          # publish the feed next to the served page (index.html at repo root)
          cp crowd-live/crowd.json crowd.json

      - name: Commit if changed
        run: |
          git config user.name  "manamana-bot"
          git config user.email "bot@users.noreply.github.com"
          git add crowd.json crowd-live/crowd.json
          git diff --cached --quiet || git commit -m "chore: refresh crowd.json [skip ci]"
          git push
