<style>

:root{
  --gold:#FFB800;
  --gold-faint:rgba(255,184,0,.1);
  --gold-border:rgba(255,184,0,.22);
  --red:#FF4422;
  --green:#3DD68C;
  --blue:#5BAFFF;
  --purple:#A78BFA;
  --bg:#0D0800;
  --s1:#1C1100;
  --s2:#261800;
  --s3:#301F00;
  --cream:#FFF5E4;
  --muted:#7A6555;
  --muted2:#4A3828;
}

html,body{
  height:100%;height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--cream);
  font-family:'Space Grotesk',-apple-system,sans-serif;
}

.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
  transform:translateY(16px);
}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0);}
.screen.out{opacity:0;transform:translateY(-16px);}

/* SPLASH */
#splash{
  background:var(--bg);
  justify-content:center;align-items:center;
  text-align:center;
  padding:32px 36px max(env(safe-area-inset-bottom,0px),48px);
  cursor:pointer;overflow:hidden;
}
.sp-glow{
  position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:110%;aspect-ratio:1;
  background:radial-gradient(ellipse,rgba(255,184,0,.16) 0%,rgba(255,68,34,.06) 50%,transparent 72%);
  pointer-events:none;
}
.sp-inner{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:0;width:100%;
}
.sp-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);margin-bottom:28px;opacity:.8;
}
.sp-logo{
  font-size:clamp(68px,20vw,100px);
  font-weight:800;line-height:.88;letter-spacing:-3px;color:var(--cream);
}
.sp-logo em{color:var(--gold);font-style:normal;}
.sp-divider{width:32px;height:1px;background:var(--muted2);margin:28px 0;}
.sp-tagline{
  font-size:15px;font-weight:500;

}
.sp-tagline strong{color:var(--cream);font-weight:700;}
.sp-moment{margin-top:10px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.3px;}

.sp-geo{

}
.sp-geo.found{color:var(--green);}
.sp-btn{

}
.sp-btn:active{filter:brightness(.88);transform:scale(.98);}
.sp-hint{margin-top:16px;font-size:11px;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;}

/* QUIZ */

}
.q-top{width:100%;max-width:400px;padding:0 28px 0;display:flex;flex-direction:column;align-items:center;gap:18px;}

.pseg{height:2px;flex:1;background:var(--s2);border-radius:2px;transition:background .35s;}

/* ── GEOLOCATION ── */
let userLat=null,userLng=null;
(function initGeo(){
  if(!navigator.geolocation){setGeoUI(false);return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{userLat=pos.coords.latitude;userLng=pos.coords.longitude;setGeoUI(true);},
    ()=>setGeoUI(false),
    {timeout:8000,maximumAge:60000}
  );
})();
function setGeoUI(ok){
  const el=document.getElementById('spGeo');
  if(!el)return;
  el.textContent=ok?'📍 Got your location':'📍 No location — showing all KL';
  if(ok)el.classList.add('found');
}

/* ── HAVERSINE ── */
function distKm(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(km){return km<1?'<1 km':km.toFixed(1)+' km';}

/* ── MOMENT ── */
function getMoment(){
  const now=new Date(),h=now.getHours(),day=now.getDay();
  const isWeekend=day===0||day===5||day===6;
  let slot,label,eyebrow;
  if(h>=6&&h<11){slot='breakfast';label='Breakfast time';eyebrow='Pagi ni, sarapan ke';}
  else if(h>=11&&h<15){slot='lunch';label='Lunch hour';eyebrow='Tengahari ni, makan ke';}
  else if(h>=15&&h<18){slot='tea';label='Tea time';eyebrow='Petang ni, teh ke';}
  else if(h>=18&&h<22){slot='dinner';label='Dinner time';eyebrow='Malam ni, pergi ke';}
  else{slot='supper';label='Supper time';eyebrow='Lewat ni, pergi ke';}
  const days=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  return{h,slot,label,eyebrow,isWeekend,dayName:days[day]};
}

   maps:'https://www.google.com/maps/search/Al-Amar+Lebanese+Restaurant+KLCC+KL',
   why:'Lebanese fine dining kat KLCC. Mezze, lamb, baklava — semua kelas atas.',
   momentCopy:{weekend:'Date night Lebanese style. Impress guaranteed.'}},

  {name:'Skillet at 163',area:'Ampang Hilir',cat:'Modern European',price:3,lat:3.1628,lng:101.7248,
   goodFor:[2,3,5],openHours:[{o:12,c:22}],bestFor:['lunch','dinner'],weekendBoost:true,
   scores:{speed:[2],cuisine:[2]},bg:'linear-gradient(160deg,#0a1a1a,#0D0800)',
   maps:'https://www.google.com/maps/search/Skillet+at+163+Ampang+KL',
   why:'Fine dining yang tak pretentious. Chef-driven, ingredient-focused, consistently excellent.',
   momentCopy:{weekend:'Special occasion dinner. Skillet delivers every time.'}},

  {name:'Entier',area:'Bangsar South',cat:'French Fine Dining',price:3,lat:3.1068,lng:101.6748,
   goodFor:[3,5],openHours:[{o:12,c:22}],bestFor:['lunch','dinner'],weekendBoost:true,
   scores:{speed:[2],cuisine:[2]},bg:'linear-gradient(160deg,#0d0a1a,#0D0800)',
   maps:'https://www.google.com/maps/search/Entier+French+Dining+Bangsar+South+KL',
   why:'French fine dining yang proper kat KL. Tasting menu, wine pairing, the whole experience.',
   momentCopy:{weekend:'Treat yourself properly. Entier is that meal.'}}
];

/* ── LAYER 1: IS OPEN ── */
function isOpen(r){
  const h=M.h;
  return r.openHours.some(w=>{
    if(w.o===0&&w.c===24)return true;
    return h>=w.o&&h<w.c;
  });
}

/* ── LAYER 2: MOOD SCORE ── */
function moodScore(r,a){
  let s=0;
  if(r.goodFor.includes(a.occasion))s+=5;
  if(r.price===a.budget)s+=4;
  else if(Math.abs(r.price-a.budget)===1)s+=1;
  if(r.scores.speed.includes(a.speed))s+=2;
  if(r.scores.cuisine.includes(a.cuisine))s+=3;
  return s;
}

/* ── LAYER 3: MOMENT SCORE ── */
function momentScore(r){
  let s=0;
  if(r.bestFor.includes(M.slot))s+=3;
  if(r.weekendBoost&&M.isWeekend)s+=2;
  return s;
}

/* ── WHY COPY ── */
function buildWhy(r){
  const mc=r.momentCopy||{};
  const add=mc[M.slot]||(M.isWeekend&&mc.weekend)||null;
  return r.why+(add?'\n\n'+add:'');
}

/* ── STATE ── */
let answers={},qIdx=0,ranked=[],rerollUsed=false;
const RADIUS_KM=15;

/* ── TRANSITIONS ── */
function go(id){
  const cur=document.querySelector('.screen.active');
  if(cur){cur.classList.add('out');setTimeout(()=>cur.classList.remove('active','out'),300);}
  setTimeout(()=>document.getElementById(id).classList.add('active'),155);
}

/* ── QUIZ RENDER ── */
function renderQ(i){
  const q=QUESTIONS[i];
  document.getElementById('prog').innerHTML=
    QUESTIONS.map((_,j)=>`<div class="pseg ${j<i?'done':j===i?'active':''}"></div>`).join('');
  document.getElementById('qNum').textContent=q.num;
  document.getElementById('qText').textContent=q.text;
  const container=document.getElementById('qOpts');
  if(q.layout==='row'){
    container.innerHTML=`<div class="opts-row">${q.opts.map(o=>`<button class="opt" onclick="pick('${q.key}',${o.v},this)"><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span></button>`).join('')}</div>`;
  }else if(q.layout==='price'){
    container.innerHTML=`<div class="opts-price">${q.opts.map(o=>`<button class="opt ${o.cls}" onclick="pick('${q.key}',${o.v},this)"><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span></button>`).join('')}</div>`;
  }else{
    container.innerHTML=q.opts.map(o=>`<button class="opt" onclick="pick('${q.key}',${o.v},this)"><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span></button>`).join('');
  }
}

function pick(key,val,btn){
  btn.classList.add('sel');
  answers[key]=val;
  const qLabel=QUESTIONS.find(q=>q.key===key);
  const optLabel=qLabel?.opts.find(o=>o.v===val)?.label||val;
  track('question_answered',{question:key,answer:optLabel,step:qIdx+1});
  setTimeout(()=>{
    qIdx++;
    if(qIdx<QUESTIONS.length){
      const q=document.getElementById('quiz');
      q.style.cssText='opacity:0;transform:translateY(-10px);transition:opacity .15s,transform .15s';
      setTimeout(()=>{renderQ(qIdx);q.style.cssText='opacity:1;transform:translateY(0);transition:opacity .2s,transform .2s';setTimeout(()=>q.style.cssText='',200);},150);
    }else{startLoading();}
  },160);
}

/* ── LOADING + GEO FILTER ── */
function startLoading(){
  go('loading');
  const msgs=['Reading your soul lah','Scanning spots near you','Checking the vibes','Almost ready dah...'];
  let mi=0;
  const lmsg=document.getElementById('lmsg');
  setTimeout(()=>{document.getElementById('lfill').style.width='100%';},80);
  const iv=setInterval(()=>{
    mi++;
    if(mi<msgs.length){lmsg.style.opacity='0';setTimeout(()=>{lmsg.textContent=msgs[mi];lmsg.style.opacity='1';},210);}
  },700);
  setTimeout(()=>{
    clearInterval(iv);
    let pool;
    if(userLat!==null){
      // attach distance and filter by radius
      const withDist=RESTAURANTS.map(r=>({...r,_dist:distKm(userLat,userLng,r.lat,r.lng)}));
      const nearby=withDist.filter(r=>r._dist<=RADIUS_KM);
      const nearbyOpen=nearby.filter(isOpen);
      pool=nearbyOpen.length>=3?nearbyOpen:nearby.length>=3?nearby:withDist;
    }else{
      const open=RESTAURANTS.filter(isOpen);
      pool=(open.length>=3?open:RESTAURANTS).map(r=>({...r,_dist:null}));
    }
    ranked=pool
      .map(r=>({...r,_s:moodScore(r,answers)+momentScore(r)+Math.random()*.4}))
      .sort((a,b)=>b._s-a._s);
    showReveal(0);
  },2900);
}

/* ── REVEAL ── */
function showReveal(idx){
  const r=ranked[idx];
  const open=isOpen(r);
  const timeMatch=r.bestFor.includes(M.slot);
  const wkBoost=r.weekendBoost&&M.isWeekend;
  const priceChip=r.price===1?`<span class="ch-jimat">Jimat</span>`:r.price===2?`<span class="ch-mid">Mid-range</span>`:`<span class="ch-splash">Splash out</span>`;
  const distChip=r._dist!=null?`<span class="ch-dist">${fmtDist(r._dist)}</span>`:'';

  document.getElementById('rvbg').style.background=r.bg;
  document.getElementById('rvtag').textContent=idx===0?'Matched':'Re-roll';
  document.getElementById('rveyebrow').textContent=M.eyebrow;
  document.getElementById('rvname').textContent=r.name;
  document.getElementById('rvmeta').textContent=r.area+' · '+r.cat;
  document.getElementById('rvwhy').textContent=buildWhy(r);

  document.getElementById('rvchips').innerHTML=[
    `<span class="ch-halal">Halal</span>`,
    distChip,
    open?`<span class="ch-open">Open now</span>`:'',
    timeMatch?`<span class="ch-time">${M.label}</span>`:'',
    wkBoost?`<span class="ch-wknd">Weekend pick</span>`:'',
    priceChip,
  ].join('');

  document.getElementById('btnGo').onclick=()=>{track('maps_clicked',{restaurant:r.name,area:r.area,category:r.cat,price_tier:r.price});window.open(r.maps,'_blank');};
  document.getElementById('btnShare').onclick=()=>{track('share_clicked',{restaurant:r.name});shareIt(r);};

  const rr=document.getElementById('btnReroll');
  if(rerollUsed||idx>0){
    rr.textContent='Dah decide. Pergi je lah.';
    rr.classList.add('spent');
  }else{
    rr.textContent='Not feeling it? One re-roll only.';
    rr.classList.remove('spent');
    rr.onclick=()=>{
      rerollUsed=true;
      document.getElementById('reveal').classList.add('out');
      setTimeout(()=>{document.getElementById('reveal').classList.remove('out');showReveal(1);},300);
    };
  }
  track('restaurant_revealed',{restaurant:r.name,area:r.area,category:r.cat,price_tier:r.price,reroll:idx>0});
  go('reveal');
}

/* ── SHARE ── */
function shareIt(r){
  const distTxt=r._dist!=null?` (${fmtDist(r._dist)} dari kau)`:'';
  const txt=`manamana dah decide untuk aku\n\nMalam ni pergi ${r.name}${distTxt} — ${r.area}.\n\n"${r.why}"\n\nCuba kau punya: manamana.io`;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
  else{window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(txt),'_blank');}
}

/* ── INIT ── */
document.getElementById('spMoment').innerHTML=
  `${M.label} — ${M.isWeekend?'hujung minggu':'hari biasa'}. <b>Lapar ke?</b>`;

document.getElementById('splash').addEventListener('click',()=>{track('quiz_start');go('quiz');renderQ(0);});
document.getElementById('spBtn').addEventListener('click',(e)=>{e.stopPropagation();track('quiz_start');go('quiz');renderQ(0);});
</script>
