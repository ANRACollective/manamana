<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}

:root{
  --gold:#FFB800;
  --gold-faint:rgba(255,184,0,.1);
  --gold-border:rgba(255,184,0,.22);
  --red:#FF4422;
  --green:#3DD68C;
  --blue:#5BAFFF;
  --purple:#A78BFA;
  --bg:#0D0800;
  --s1:#1C1100;
  --s2:#261800;
  --s3:#301F00;
  --cream:#FFF5E4;
  --muted:#7A6555;
  --muted2:#4A3828;
}

html,body{
  height:100%;height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--cream);
  font-family:'Space Grotesk',-apple-system,sans-serif;
}

.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
  transform:translateY(16px);
}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0);}
.screen.out{opacity:0;transform:translateY(-16px);}

/* ── SPLASH ── */
#splash{
  background:var(--bg);
  justify-content:center;align-items:center;
  text-align:center;
  padding:32px 36px max(env(safe-area-inset-bottom,0px),48px);
  cursor:pointer;overflow:hidden;
}
.sp-glow{
  position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:110%;aspect-ratio:1;
  background:radial-gradient(ellipse,rgba(255,184,0,.16) 0%,rgba(255,68,34,.06) 50%,transparent 72%);
  pointer-events:none;
}
.sp-inner{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:0;width:100%;
}
.sp-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);margin-bottom:28px;opacity:.8;
}
.sp-logo{
  font-size:clamp(68px,20vw,100px);
  font-weight:800;line-height:.88;letter-spacing:-3px;color:var(--cream);
}
.sp-logo em{color:var(--gold);font-style:normal;}
.sp-divider{width:32px;height:1px;background:var(--muted2);margin:28px 0;}
.sp-tagline{
  font-size:15px;font-weight:500;
  color:var(--muted);line-height:1.6;max-width:260px;
}
.sp-tagline strong{color:var(--cream);font-weight:700;}

/* Dietary toggle */
.diet-wrap{margin-top:16px;display:flex;gap:6px;justify-content:center;}
.diet-btn{
  all:unset;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  padding:7px 16px;border-radius:100px;cursor:pointer;
  border:1px solid var(--s3);color:var(--muted);
  transition:all .15s;
}
.diet-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-faint);}

.sp-moment{margin-top:10px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.3px;}
.sp-moment b{color:var(--gold);font-weight:700;}
.sp-geo{
  margin-top:10px;
  font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted2);transition:color .3s;
}
.sp-geo.found{color:var(--green);}

/* Sedap/mehh feedback banner */
.sedap-banner{
  display:none;width:100%;
  background:var(--s1);border:1px solid var(--s2);
  border-radius:14px;padding:14px 18px;
  text-align:center;margin-top:14px;
}
.sedap-banner.visible{display:block;}
.sedap-q{font-size:13px;color:var(--cream);font-weight:600;margin-bottom:10px;line-height:1.5;}
.sedap-q em{color:var(--gold);font-style:normal;}
.sedap-btns{display:flex;gap:8px;justify-content:center;}
.btn-sedap,.btn-mehh{
  all:unset;font-size:14px;font-weight:700;
  padding:8px 20px;border-radius:100px;cursor:pointer;border:1px solid;
  transition:all .12s;font-family:inherit;
}
.btn-sedap{border-color:var(--green);color:var(--green);}
.btn-sedap:active{background:rgba(61,214,140,.15);}
.btn-mehh{border-color:var(--muted2);color:var(--muted);}
.btn-mehh:active{background:rgba(255,255,255,.05);}

.sp-btn{
  margin-top:28px;background:var(--gold);color:#000;
  font-size:16px;font-weight:800;padding:18px 0;
  border-radius:14px;border:none;cursor:pointer;font-family:inherit;
  width:100%;letter-spacing:.5px;
  transition:filter .12s,transform .1s;
}
.sp-btn:active{filter:brightness(.88);transform:scale(.98);}
.sp-hint{margin-top:16px;font-size:11px;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;}
.sp-teaser{margin-top:6px;font-size:12px;color:var(--muted);font-weight:500;}
.sp-teaser b{color:var(--gold);}
.sp-profile-link{
  margin-top:10px;font-size:11px;color:var(--muted2);
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  transition:color .15s;
}
.sp-profile-link:active{color:var(--muted);}

/* ── QUIZ ── */
#quiz{
  background:var(--bg);
  padding-top:max(env(safe-area-inset-top,0px),52px);
  align-items:center;
}
.q-top{width:100%;max-width:400px;padding:0 28px 0;display:flex;flex-direction:column;align-items:center;gap:18px;}
.prog{display:flex;gap:5px;width:100%;}
.pseg{height:2px;flex:1;background:var(--s2);border-radius:2px;transition:background .35s;}
.pseg.done{background:var(--gold);}
.pseg.active{background:rgba(255,184,0,.35);}
.q-num{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.7;text-align:center;}
.q-text{
  width:100%;max-width:400px;padding:20px 28px 0;
  font-size:clamp(24px,7.5vw,34px);font-weight:800;line-height:1.1;
  letter-spacing:-.8px;color:var(--cream);text-align:center;
}
.q-opts{
  flex:1;overflow-y:auto;width:100%;max-width:400px;
  padding:22px 28px max(env(safe-area-inset-bottom,0px),28px);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.opt{
  all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 22px;background:var(--s1);border:1px solid var(--s2);
  border-radius:14px;cursor:pointer;width:100%;text-align:center;
  transition:border-color .12s,background .12s,transform .1s;
}
.opt:active,.opt.sel{border-color:var(--gold);background:var(--gold-faint);transform:scale(.98);}
.opt-label{font-size:16px;font-weight:700;color:var(--cream);letter-spacing:-.2px;line-height:1.2;}
.opt-sub{font-size:12px;font-weight:500;color:var(--muted);margin-top:3px;}
.opts-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
.opts-row .opt{padding:22px 12px;}
.opts-price{display:flex;flex-direction:column;gap:10px;width:100%;}
.opt-jimat{border-color:#2a6640;}
.opt-jimat:active,.opt-jimat.sel{border-color:var(--green);background:rgba(61,214,140,.08);}
.opt-jimat .opt-label{color:var(--green);}
.opt-jimat .opt-sub{color:rgba(61,214,140,.5);}
.opt-mid{border-color:var(--s3);}
.opt-mid:active,.opt-mid.sel{border-color:var(--gold);background:var(--gold-faint);}
.opt-mid .opt-label{color:var(--cream);}
.opt-splash{border-color:#3d2200;}
.opt-splash:active,.opt-splash.sel{border-color:var(--red);background:rgba(255,68,34,.08);}
.opt-splash .opt-label{color:var(--red);}
.opt-splash .opt-sub{color:rgba(255,68,34,.5);}

/* ── LOADING ── */
#loading{background:var(--bg);justify-content:center;align-items:center;text-align:center;gap:28px;overflow:hidden;}
.ld-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,184,0,.09) 0%,transparent 60%);}
.ld-title{position:relative;z-index:1;font-size:clamp(30px,9vw,42px);font-weight:800;line-height:1.1;letter-spacing:-1.2px;color:var(--cream);text-align:center;}
.ld-title em{color:var(--gold);font-style:normal;}
.ld-track{position:relative;z-index:1;width:160px;height:2px;background:var(--s2);border-radius:2px;overflow:hidden;}
.ld-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width 2.7s cubic-bezier(.4,0,.2,1);}
.ld-msg{position:relative;z-index:1;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:opacity .25s;}

/* ── REVEAL ── */
#reveal{padding:0;overflow:hidden;}
.rv-bg{position:absolute;inset:0;z-index:0;transition:background .5s;}
.rv-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(13,8,0,1) 35%,rgba(13,8,0,.6) 70%,rgba(13,8,0,.2) 100%);}
.rv-top{
  position:relative;z-index:3;
  padding:max(env(safe-area-inset-top,0px),48px) 28px 0;
  display:flex;justify-content:space-between;align-items:center;
}
.rv-logo{font-size:18px;font-weight:800;letter-spacing:-1px;color:var(--cream);}
.rv-logo em{color:var(--gold);font-style:normal;}
.rv-tag{
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  background:var(--gold-faint);border:1px solid var(--gold-border);
  color:var(--gold);padding:5px 12px;border-radius:100px;
  transition:all .3s;
}
.rv-tag.alt{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3);color:var(--purple);}
.rv-body{
  position:absolute;bottom:0;left:0;right:0;z-index:3;
  padding:0 28px max(env(safe-area-inset-bottom,0px),36px);
  display:flex;flex-direction:column;gap:13px;
  transition:opacity .2s;
}
.rv-chips{display:flex;gap:7px;flex-wrap:wrap;}
.ch-halal{display:inline-flex;align-items:center;gap:5px;background:rgba(61,214,140,.15);border:1px solid rgba(61,214,140,.3);color:var(--green);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:100px;}
.ch-open{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid rgba(91,175,255,.4);color:var(--blue);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:4px;}
.ch-open::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.5s infinite;}
.ch-open.closing{border-color:rgba(255,184,0,.4);color:var(--gold);}
.ch-open.closing::before{background:var(--gold);animation:none;}
.ch-open.h24{border-color:rgba(167,139,250,.4);color:var(--purple);}
.ch-open.h24::before{background:var(--purple);animation:none;}
.ch-open.soon{border-color:rgba(91,175,255,.3);color:var(--blue);opacity:.7;}
.ch-open.soon::before{background:var(--blue);animation:none;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.ch-time{display:inline-flex;align-items:center;gap:5px;background:var(--gold-faint);border:1px solid var(--gold-border);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:100px;}
.ch-wknd{display:inline-flex;align-items:center;gap:5px;background:rgba(255,68,34,.1);border:1px solid rgba(255,68,34,.3);color:var(--red);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:6px;}
.ch-jimat{display:inline-flex;align-items:center;background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.25);color:var(--green);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:100px;}
.ch-mid{display:inline-flex;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:100px;}
.ch-splash{display:inline-flex;align-items:center;background:rgba(255,68,34,.08);border:1px solid rgba(255,68,34,.25);color:var(--red);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:100px;}
.ch-dist{display:inline-flex;align-items:center;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);color:var(--purple);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:100px;}
.rv-eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.rv-name{font-size:clamp(44px,14vw,72px);font-weight:800;line-height:.92;letter-spacing:-2px;color:var(--cream);}
.rv-meta{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.2px;}
.rv-why{font-size:15px;line-height:1.65;color:rgba(255,245,228,.6);border-left:2px solid var(--gold);padding-left:14px;}
/* "atau ini pulak" subtle text-link */
.btn-atau{
  all:unset;display:block;text-align:center;
  font-size:13px;font-weight:600;color:var(--muted);
  letter-spacing:.3px;cursor:pointer;padding:4px 0;
  transition:color .15s;
}
.btn-atau:active{color:var(--cream);}
.btn-atau.hidden{display:none;}
.btn-go{all:unset;display:block;width:100%;background:var(--gold);color:#000;padding:19px 24px;border-radius:14px;font-size:18px;font-weight:800;text-align:center;cursor:pointer;letter-spacing:-.2px;transition:filter .12s,transform .1s,background .3s,color .3s;font-family:inherit;}
.btn-go:active{filter:brightness(.88);transform:scale(.98);}
.btn-share{all:unset;display:block;width:100%;border:1px solid var(--s3);color:var(--muted);padding:15px 24px;border-radius:14px;font-size:14px;font-weight:700;text-align:center;cursor:pointer;letter-spacing:.2px;transition:border-color .12s,color .12s;font-family:inherit;}
.btn-share:active{border-color:var(--muted2);color:var(--cream);}

/* ── PROFILE SCREEN ── */
#profile{
  background:var(--bg);
  padding-top:max(env(safe-area-inset-top,0px),52px);
  flex-direction:column;
}
.pf-header{
  display:flex;align-items:center;gap:16px;
  padding:0 28px 20px;flex-shrink:0;
}
.pf-back{
  all:unset;font-size:14px;font-weight:700;
  color:var(--muted);cursor:pointer;letter-spacing:.3px;
  transition:color .15s;
}
.pf-back:active{color:var(--cream);}
.pf-title{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--cream);}
.pf-body{
  padding:0 28px max(env(safe-area-inset-bottom,0px),48px);
  overflow-y:auto;flex:1;
  display:flex;flex-direction:column;gap:16px;
}
.pf-stat{
  font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--gold);
}
.pf-insight{
  font-size:16px;font-weight:700;color:var(--cream);
  line-height:1.4;letter-spacing:-.2px;
}
.pf-section-title{
  font-size:10px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;color:var(--muted);margin-top:8px;
}
.pf-matches{display:flex;flex-direction:column;gap:10px;}
.pf-match-row{
  padding:14px 16px;background:var(--s1);
  border-radius:12px;border:1px solid var(--s2);
}
.pf-match-name{font-size:15px;font-weight:700;color:var(--cream);}
.pf-match-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.pf-empty{
  font-size:14px;color:var(--muted);
  text-align:center;padding:32px 0;line-height:1.8;
}
.btn-pf-delete{
  all:unset;display:block;width:100%;text-align:center;
  border:1px solid rgba(255,68,34,.3);color:var(--red);
  padding:14px;border-radius:14px;font-size:14px;font-weight:700;
  cursor:pointer;margin-top:8px;transition:background .12s;font-family:inherit;
}
.btn-pf-delete:active{background:rgba(255,68,34,.08);}
.pf-delete-hint{font-size:11px;color:var(--muted2);text-align:center;}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="screen active" id="splash">
  <div class="sp-glow"></div>
  <div class="sp-inner">
    <div class="sp-eyebrow">Made for Malaysia</div>
    <div class="sp-logo">mana<em>mana</em></div>
    <div class="sp-divider"></div>
    <div class="sp-tagline">Tak tahu nak makan mana?<br><strong>We'll decide. You just eat.</strong></div>
    <div class="diet-wrap">
      <button class="diet-btn" id="dietHalal" onclick="setDiet('halal',event)">Halal</button>
      <button class="diet-btn" id="dietNoPref" onclick="setDiet('no-pref',event)">Semua ok</button>
    </div>
    <div class="sp-moment" id="spMoment"></div>
    <div class="sp-geo" id="spGeo">📍 Locating you...</div>
    <div class="sedap-banner" id="sedapBanner">
      <div class="sedap-q" id="sedapQ"></div>
      <div class="sedap-btns">
        <button class="btn-sedap" id="btnSedap">Sedap 😋</button>
        <button class="btn-mehh" id="btnMehh">Mehh 😐</button>
      </div>
    </div>
    <button class="sp-btn" id="spBtn">Let's go lah</button>
    <div class="sp-hint">tap anywhere to start</div>
    <div class="sp-teaser" id="spTeaser"></div>
    <div class="sp-profile-link" id="spProfileLink">Profile aku</div>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="quiz">
  <div class="q-top">
    <div class="prog" id="prog"></div>
    <div class="q-num" id="qNum"></div>
  </div>
  <div class="q-text" id="qText"></div>
  <div class="q-opts" id="qOpts"></div>
</div>

<!-- LOADING -->
<div class="screen" id="loading">
  <div class="ld-glow"></div>
  <div class="ld-title">Finding your<br><em>perfect makan...</em></div>
  <div class="ld-track"><div class="ld-fill" id="lfill"></div></div>
  <div class="ld-msg" id="lmsg">Reading your soul lah</div>
</div>

<!-- REVEAL -->
<div class="screen" id="reveal">
  <div class="rv-bg" id="rvbg"></div>
  <div class="rv-top">
    <div class="rv-logo">mana<em>mana</em></div>
    <div class="rv-tag" id="rvtag">Matched</div>
  </div>
  <div class="rv-body" id="rvBody">
    <div class="rv-chips" id="rvchips"></div>
    <div class="rv-eyebrow" id="rveyebrow">Malam ni, pergi ke</div>
    <div class="rv-name" id="rvname"></div>
    <div class="rv-meta" id="rvmeta"></div>
    <div class="rv-why" id="rvwhy"></div>
    <button class="btn-atau hidden" id="btnAtau">atau ini pulak →</button>
    <button class="btn-go" id="btnGo">Pergi dah</button>
    <button class="btn-share" id="btnShare">Share dengan kawan-kawan</button>
  </div>
</div>

<!-- PROFILE -->
<div class="screen" id="profile">
  <div class="pf-header">
    <button class="pf-back" id="pfBack">← Balik</button>
    <div class="pf-title">Profile aku</div>
  </div>
  <div class="pf-body" id="pfBody"></div>
</div>

<script>
/* ════════════════════════════════════════════
   CONSTANTS & VERSION
   ════════════════════════════════════════════ */
const RESTAURANTS_VERSION = '2026-04-26';
// localStorage keys
const PREF_KEY     = 'mana_prefs_v1';
const RECENT_KEY   = 'mana_recent_v1';
const HISTORY_KEY  = 'mana_history_v1';
const FEEDBACK_KEY = 'mana_feedback_v1';
const LAST_KEY     = 'mana_last_v1';
const NEG_KEY      = 'mana_neg_v1';
const DIET_KEY     = 'mana_diet_v1';
const VISITS_KEY   = 'mana_visits_v1';

/* ════════════════════════════════════════════
   GEOLOCATION
   ════════════════════════════════════════════ */
let userLat=null,userLng=null;
(function initGeo(){
  if(!navigator.geolocation){setGeoUI(false);return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{userLat=pos.coords.latitude;userLng=pos.coords.longitude;setGeoUI(true);},
    ()=>setGeoUI(false),
    {timeout:8000,maximumAge:60000}
  );

/* ════════════════════════════════════════════
   HAVERSINE
   ════════════════════════════════════════════ */
function distKm(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(km){return km<1?'<1 km':km.toFixed(1)+' km';}

   MOMENT
   ════════════════════════════════════════════ */
function getMoment(){
  const now=new Date(),h=now.getHours(),day=now.getDay();
  const isWeekend=day===0||day===5||day===6;
  let slot,label,eyebrow;
  if(h>=6&&h<11){slot='breakfast';label='Breakfast time';eyebrow='Pagi ni, sarapan ke';}
  else if(h>=11&&h<15){slot='lunch';label='Lunch hour';eyebrow='Tengahari ni, makan ke';}
  else if(h>=15&&h<18){slot='tea';label='Tea time';eyebrow='Petang ni, teh ke';}
  else if(h>=18&&h<22){slot='dinner';label='Dinner time';eyebrow='Malam ni, pergi ke';}
  else{slot='supper';label='Supper time';eyebrow='Lewat ni, pergi ke';}
  const days=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  return{h,slot,label,eyebrow,isWeekend,dayName:days[day]};
}

/* ════════════════════════════════════════════
   LOCALSTORAGE HELPERS
   ════════════════════════════════════════════ */
function lsGet(key,def){try{const v=localStorage.getItem(key);return v===null?def:JSON.parse(v);}catch{return def;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

/* Prefs */
function loadPrefs(){return lsGet(PREF_KEY,{});}
function savePrefs(r){
  try{
    const p=loadPrefs();
    const c=r.scores.cuisine[0];
    p.cuisine=p.cuisine||{};p.cuisine[c]=(p.cuisine[c]||0)+1;
    p.price=p.price||{};p.price[r.price]=(p.price[r.price]||0)+1;
    const aKey=r.area.split(' ')[0];
    p.area=p.area||{};p.area[aKey]=(p.area[aKey]||0)+1;
    if(answers.occasion){p.occ=p.occ||{};p.occ[answers.occasion]=(p.occ[answers.occasion]||0)+1;}
    lsSet(PREF_KEY,p);
  }catch{}
}

/* Recency (HIGH-5) */
function loadRecent(){return lsGet(RECENT_KEY,[]);}
function saveRecent(name){
  try{
    let r=loadRecent().filter(e=>e.n!==name);
    r.unshift({n:name,t:Date.now()});
    lsSet(RECENT_KEY,r.slice(0,10));
  }catch{}
}
function recencyPenalty(r){
  const rec=loadRecent();
  const e=rec.find(x=>x.n===r.name);
  if(!e)return 0;
  const days=(Date.now()-e.t)/864e5;
  if(days<=7)return -5;
  if(days<=30)return -2;
  return 0;
}

/* History */
function loadHistory(){return lsGet(HISTORY_KEY,[]);}
function saveToHistory(r,mapsClicked){
  try{
    const h=loadHistory();
    h.unshift({name:r.name,area:r.area,cat:r.cat,price:r.price,slot:M.slot,ts:Date.now(),mapsClicked:!!mapsClicked});
    lsSet(HISTORY_KEY,h.slice(0,50));
  }catch{}
}

/* Feedback (MEDIUM-3) */
function loadFeedback(){return lsGet(FEEDBACK_KEY,[]);}
function saveFeedback(matchData,rating){
  try{
    const fb=loadFeedback().filter(e=>e.n!==matchData.n);
    fb.unshift({n:matchData.n,ts:Date.now(),rating});
    lsSet(FEEDBACK_KEY,fb.slice(0,20));
    if(rating==='sedap'){
      const p=loadPrefs();
      p.cuisine=p.cuisine||{};p.cuisine[matchData.cuisine]=(p.cuisine[matchData.cuisine]||0)+1;
      p.price=p.price||{};p.price[matchData.price]=(p.price[matchData.price]||0)+1;
      const aKey=(matchData.area||'').split(' ')[0];
      if(aKey){p.area=p.area||{};p.area[aKey]=(p.area[aKey]||0)+1;}
      lsSet(PREF_KEY,p);
    }else if(rating==='mehh'){
      const neg=lsGet(NEG_KEY,{});
      neg.cuisine=neg.cuisine||{};neg.cuisine[matchData.cuisine]=(neg.cuisine[matchData.cuisine]||0)+1;
      neg.price=neg.price||{};neg.price[matchData.price]=(neg.price[matchData.price]||0)+1;
      lsSet(NEG_KEY,neg);
    }
    const days=matchData.ts?((Date.now()-matchData.ts)/864e5).toFixed(1):null;
    track('match_feedback',{restaurant:matchData.n,rating,days_since_match:days});
    lsSet(LAST_KEY,null);
  }catch{}
}

/* Dietary mode (CRITICAL-4) */
function getDiet(){return localStorage.getItem(DIET_KEY)||'halal';}
function setDiet(mode,e){
  if(e)e.stopPropagation();
  localStorage.setItem(DIET_KEY,mode);
  updateDietUI();
  track('diet_mode_changed',{mode});
}
function updateDietUI(){
  const d=getDiet();
  document.getElementById('dietHalal').classList.toggle('active',d==='halal');
  document.getElementById('dietNoPref').classList.toggle('active',d==='no-pref');
}

/* Visit counter */
function incVisit(){
  const v=(parseInt(localStorage.getItem(VISITS_KEY)||'0'))+1;
  localStorage.setItem(VISITS_KEY,String(v));
  return v;
}

/* Helpers */
function getTopKey(obj){
  if(!obj)return null;
  const e=Object.entries(obj);
  if(!e.length)return null;
  return e.sort((a,b)=>b[1]-a[1])[0][0];
}
function sumObj(obj){return obj?Object.values(obj).reduce((a,b)=>a+b,0):0;}

/* ════ OPEN SIGNAL (MEDIUM-2) ════ */
function openSignal(r){
  const h=M.h;
  for(const w of r.openHours){
    if(w.o===0&&w.c===24)return '24h';
    if(h>=w.o&&h<w.c){
      if(w.c-h<=1)return 'closing-soon';
      return 'open';
    }
    if(w.o>h&&(w.o-h)<=0.5)return 'opening-soon';
  }
  return 'closed';
}
function isOpen(r){return['open','closing-soon','24h'].includes(openSignal(r));}

/* ════ SCORING ════ */
function moodScore(r,a){
  let s=0;
  if(r.goodFor.includes(a.occasion))s+=5;
  if(r.price===a.budget)s+=4;
  else if(Math.abs(r.price-a.budget)===1)s+=1;
  if(r.scores.cuisine.includes(a.cuisine))s+=3;
  return s;
}
function momentScore(r){
  let s=0;
  if(r.bestFor.includes(M.slot))s+=3;
  if(r.weekendBoost&&M.isWeekend)s+=2;
  const lateNight=M.h>=22||M.h<6;
  if(lateNight&&openSignal(r)==='24h')s+=3;
  return s;
}
function prefScore(r){
  const p=loadPrefs(),neg=lsGet(NEG_KEY,{});
  let s=0;
  if(p.cuisine&&sumObj(p.cuisine)>0){
    const c=r.scores.cuisine[0],pos=p.cuisine[c]||0,negC=(neg.cuisine&&neg.cuisine[c])||0;
    s+=Math.max(0,(pos-negC*0.5)/sumObj(p.cuisine))*0.7;
  }
  if(p.price&&sumObj(p.price)>0){
    const pos=p.price[r.price]||0,negP=(neg.price&&neg.price[r.price])||0;
    s+=Math.max(0,(pos-negP*0.5)/sumObj(p.price))*0.6;
  }
  if(p.area&&sumObj(p.area)>0){
    const aKey=r.area.split(' ')[0];
    s+=((p.area[aKey]||0)/sumObj(p.area))*0.4;
  }
  return s;
}

/* ════ CHIP BUILDERS ════ */
function buildOpenChip(sig,r){
  if(sig==='24h')return`<span class="ch-open h24">24 Hours</span>`;
  if(sig==='open')return`<span class="ch-open">Open now</span>`;
  if(sig==='closing-soon'){
    let minsLeft='';
    for(const w of(r||{openHours:[]}).openHours){
      if(M.h>=w.o&&M.h<w.c){minsLeft=` · ${Math.round((w.c-M.h)*60)}min`;break;}
    }
    return`<span class="ch-open closing">Closing soon${minsLeft}</span>`;
  }
  if(sig==='opening-soon')return`<span class="ch-open soon">Opening soon</span>`;
  return'';
}
function buildPriceChip(price){
  if(price===1)return`<span class="ch-jimat">Jimat</span>`;
  if(price===2)return`<span class="ch-mid">Mid-range</span>`;
  return`<span class="ch-splash">Splash out</span>`;
}

/* ════ STATE ════ */
let answers={},qIdx=0,ranked=[];
let rerollsUsed=0,revealTs=0,revealCleanup=null;
const RADIUS_KM=15;

/* ════ TRANSITIONS ════ */
function go(id){
  const cur=document.querySelector('.screen.active');
  if(cur){cur.classList.add('out');setTimeout(()=>cur.classList.remove('active','out'),300);}
  setTimeout(()=>document.getElementById(id).classList.add('active'),155);
}

/* ════ QUIZ ════ */
function renderQ(i){
  const q=QUESTIONS[i];
  document.getElementById('prog').innerHTML=
    QUESTIONS.map((_,j)=>`<div class="pseg ${j<i?'done':j===i?'active':''}"></div>`).join('');
  document.getElementById('qNum').textContent=q.num;
  document.getElementById('qText').textContent=q.text;
  const container=document.getElementById('qOpts');
  if(q.layout==='row'){
    container.innerHTML=`<div class="opts-row">${q.opts.map(o=>`<button class="opt" onclick="pick('${q.key}',${o.v},this)"><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span></button>`).join('')}</div>`;
  }else if(q.layout==='price'){
    container.innerHTML=`<div class="opts-price">${q.opts.map(o=>`<button class="opt ${o.cls}" onclick="pick('${q.key}',${o.v},this)"><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span></button>`).join('')}</div>`;
  }else{
    container.innerHTML=q.opts.map(o=>`<button class="opt" onclick="pick('${q.key}',${o.v},this)"><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span></button>`).join('');
  }
}
function pick(key,val,btn){
  btn.classList.add('sel');
  answers[key]=val;
  const qLabel=QUESTIONS.find(q=>q.key===key);
  const optLabel=qLabel?.opts.find(o=>o.v===val)?.label||val;
  track('question_answered',{question:key,answer:optLabel,step:qIdx+1});
  setTimeout(()=>{
    qIdx++;
    if(qIdx<QUESTIONS.length){
      const q=document.getElementById('quiz');
      q.style.cssText='opacity:0;transform:translateY(-10px);transition:opacity .15s,transform .15s';
      setTimeout(()=>{renderQ(qIdx);q.style.cssText='opacity:1;transform:translateY(0);transition:opacity .2s,transform .2s';setTimeout(()=>q.style.cssText='',200);},150);
    }else{startLoading();}
  },160);
}

/* ════ LOADING + MATCHING ════ */
function buildWhy(r){
  const mc=r.momentCopy||{};
  const add=mc[M.slot]||(M.isWeekend&&mc.weekend)||null;
  return r.why+(add?'\n\n'+add:'');
}
function startLoading(){
  go('loading');
  const msgs=['Reading your soul lah','Scanning spots near you','Checking the vibes','Almost ready dah...'];
  let mi=0;
  const lmsg=document.getElementById('lmsg');
  setTimeout(()=>{document.getElementById('lfill').style.width='100%';},80);
  const iv=setInterval(()=>{
    mi++;
    if(mi<msgs.length){lmsg.style.opacity='0';setTimeout(()=>{lmsg.textContent=msgs[mi];lmsg.style.opacity='1';},210);}
  },700);
  setTimeout(()=>{
    clearInterval(iv);
    let pool;
    if(userLat!==null){
      const withDist=RESTAURANTS.map(r=>({...r,_dist:distKm(userLat,userLng,r.lat,r.lng)}));
      const nearby=withDist.filter(r=>r._dist<=RADIUS_KM);
      const nearbyOpen=nearby.filter(isOpen);
      pool=nearbyOpen.length>=3?nearbyOpen:nearby.length>=3?nearby:withDist;
    }else{
      const open=RESTAURANTS.filter(isOpen);
      pool=(open.length>=3?open:RESTAURANTS).map(r=>({...r,_dist:null}));
    }
    const diet=getDiet();
    if(diet==='halal'){
      const filtered=pool.filter(r=>(r.halalStatus||'pork-free')!=='serves-pork');
      if(filtered.length>=3)pool=filtered;
    }
    ranked=pool
      .map(r=>({
        ...r,
        _s:moodScore(r,answers)+momentScore(r)+prefScore(r)+recencyPenalty(r),
        _smood:moodScore(r,answers),_smoment:momentScore(r),
        _spref:prefScore(r),_srecency:recencyPenalty(r)
      }))
      .sort((a,b)=>b._s-a._s);
    showReveal();
  },2900);
}

/* ════ REVEAL ════ */
function populateReveal(r,isAlt){
  const sig=openSignal(r);
  const distChip=r._dist!=null?`<span class="ch-dist">${fmtDist(r._dist)}</span>`:'';
  document.getElementById('rvbg').style.background=r.bg;
  const tagEl=document.getElementById('rvtag');
  if(isAlt){tagEl.textContent='Cadangan lain';tagEl.classList.add('alt');}
  else{tagEl.textContent='Matched';tagEl.classList.remove('alt');}
  document.getElementById('rveyebrow').textContent=M.eyebrow;
  document.getElementById('rvname').textContent=r.name;
  document.getElementById('rvmeta').textContent=r.area+' · '+r.cat;
  document.getElementById('rvwhy').textContent=buildWhy(r);
  document.getElementById('rvchips').innerHTML=[
    `<span class="ch-halal">Halal</span>`,distChip,buildOpenChip(sig,r),
    r.bestFor.includes(M.slot)?`<span class="ch-time">${M.label}</span>`:'',
    r.weekendBoost&&M.isWeekend?`<span class="ch-wknd">Weekend pick</span>`:'',
    buildPriceChip(r.price),
  ].join('');
  const closing=sig==='closing-soon';
  document.getElementById('btnGo').textContent=isAlt?(closing?'Pergi cepat ⚡':'Pergi sini pulak'):(closing?'Pergi cepat ⚡':'Pergi dah');
}
function showReveal(){
  rerollsUsed=0;revealTs=Date.now();
  const r=ranked[0];if(!r)return;
  saveToHistory(r,false);
  populateReveal(r,false);
  const atauBtn=document.getElementById('btnAtau');
  if(ranked.length>1){atauBtn.classList.remove('hidden');atauBtn.onclick=()=>swapToAlternate();}
  else{atauBtn.classList.add('hidden');}
  track('reveal_shown',{
    restaurant:r.name,area:r.area,price_tier:r.price,
    score_total:r._s?.toFixed(2),score_mood:r._smood,score_moment:r._smoment,
    score_pref:r._spref?.toFixed(2),score_recency:r._srecency,
    has_alternate:ranked.length>1,dataset_version:RESTAURANTS_VERSION
  });
  if(revealCleanup)document.removeEventListener('visibilitychange',revealCleanup);
  revealCleanup=()=>{
    if(document.hidden){
      track('reveal_abandoned',{restaurant:r.name,time_on_reveal_ms:Date.now()-revealTs,action:'tab_hidden'});
      document.removeEventListener('visibilitychange',revealCleanup);revealCleanup=null;
    }
  };
  document.addEventListener('visibilitychange',revealCleanup);
  document.getElementById('btnGo').onclick=()=>commitGo(r);
  document.getElementById('btnShare').onclick=()=>{track('share_clicked',{restaurant:r.name});shareIt(r);};
  go('reveal');
}
function commitGo(r){
  if(revealCleanup){document.removeEventListener('visibilitychange',revealCleanup);revealCleanup=null;}
  track('maps_clicked',{
    restaurant:r.name,area:r.area,category:r.cat,price_tier:r.price,
    time_to_click_ms:Date.now()-revealTs,rerolls_used:rerollsUsed
  });
  savePrefs(r);saveRecent(r.name);
  lsSet(LAST_KEY,{n:r.name,area:r.area,price:r.price,cuisine:r.scores.cuisine[0],ts:Date.now()});
  const awayTs=Date.now();
  const returnHandler=()=>{
    if(!document.hidden){
      track('maps_returned',{restaurant:r.name,time_away_ms:Date.now()-awayTs});
      document.removeEventListener('visibilitychange',returnHandler);
    }
  };
  document.addEventListener('visibilitychange',returnHandler);
  window.open(r.maps,'_blank');
}

/* ════ PATH C: ATAU INI PULAK (CRITICAL-1) ════ */
function swapToAlternate(){
  const alt=ranked[1];if(!alt||rerollsUsed>0)return;
  rerollsUsed=1;
  track('alternate_viewed',{primary:ranked[0].name,alternate:alt.name,area:alt.area});
  const body=document.getElementById('rvBody');
  body.style.opacity='0';body.style.transition='opacity .18s';
  setTimeout(()=>{
    populateReveal(alt,true);
    document.getElementById('btnAtau').classList.add('hidden');
    document.getElementById('btnGo').onclick=()=>commitGo(alt);
    document.getElementById('btnShare').onclick=()=>{track('share_clicked',{restaurant:alt.name});shareIt(alt);};
    body.style.opacity='1';
  },180);
}

/* ════ SHARE ════ */
function shareIt(r){
  const distTxt=r._dist!=null?` (${fmtDist(r._dist)} dari kau)`:'';
  const txt=`manamana dah decide untuk aku\n\nMalam ni pergi ${r.name}${distTxt} — ${r.area}.\n\n"${r.why}"\n\nCuba kau punya: manamana.io`;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
  else{window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(txt),'_blank');}
}

/* ════ SEDAP / MEHH (MEDIUM-3) ════ */
function checkFeedbackPrompt(){
  const last=lsGet(LAST_KEY,null);
  if(!last||!last.n)return;
  if(loadFeedback().find(e=>e.n===last.n))return;
  const banner=document.getElementById('sedapBanner');
  document.getElementById('sedapQ').innerHTML=`Last time kau pergi <em>${last.n}</em>. Best tak?`;
  banner.classList.add('visible');
  document.getElementById('btnSedap').onclick=e=>{e.stopPropagation();saveFeedback(last,'sedap');banner.classList.remove('visible');};
  document.getElementById('btnMehh').onclick=e=>{e.stopPropagation();saveFeedback(last,'mehh');banner.classList.remove('visible');};
}

/* ════ PROFILE (HIGH-4) ════ */
function renderProfile(){
  track('profile_viewed',{match_count:loadHistory().length});
  const history=loadHistory(),prefs=loadPrefs(),fb=loadFeedback();
  const topArea=getTopKey(prefs.area),topPrice=getTopKey(prefs.price);
  let html='';
  if(history.length>0){
    const priceMsg=topPrice==='1'?'Value-hunter. Kau tau makan.':topPrice==='3'?'Splash-out energy. No regrets.':'Mid-range. Balanced. Practical. We see you.';
    html+=`<div class="pf-stat">${history.length} match${history.length!==1?'es':''} made${topArea?` · kawasan fav: ${topArea}`:''}</div>`;
    html+=`<div class="pf-insight">${priceMsg}</div>`;
    html+=`<div class="pf-section-title">Last matches</div><div class="pf-matches">`;
    history.slice(0,5).forEach(h=>{
      const date=new Date(h.ts).toLocaleDateString('ms-MY',{day:'numeric',month:'short'});
      const fbEntry=fb.find(e=>e.n===h.name);
      const rating=fbEntry?(fbEntry.rating==='sedap'?' · 😋 Sedap':' · 😐 Mehh'):'';
      html+=`<div class="pf-match-row"><div class="pf-match-name">${h.name}</div><div class="pf-match-meta">${h.area} · ${date}${rating}</div></div>`;
    });
    html+=`</div>`;
  }else{
    html+=`<div class="pf-empty">Belum ada history lagi.<br>Pergi makan dulu lah.</div>`;
  }
  html+=`<button class="btn-pf-delete" id="btnPfDelete">Reset semua data</button>`;
  html+=`<div class="pf-delete-hint">Aku still ingat 7 hari lepas untuk variety</div>`;
  document.getElementById('pfBody').innerHTML=html;
  document.getElementById('btnPfDelete').onclick=()=>{
    if(confirm('Reset semua preferences dan history?')){
      const recent7=loadRecent().filter(e=>(Date.now()-e.t)/864e5<=7);
      [PREF_KEY,HISTORY_KEY,FEEDBACK_KEY,LAST_KEY,NEG_KEY].forEach(k=>localStorage.removeItem(k));
      lsSet(RECENT_KEY,recent7);
      track('profile_deleted');go('splash');
    }
  };
}

/* ════ SPLASH TEASER (HIGH-4) ════ */
function updateSplashTeaser(){
  const h=loadHistory(),prefs=loadPrefs(),el=document.getElementById('spTeaser');
  if(!el||h.length<3)return;
  const topArea=getTopKey(prefs.area);
  el.innerHTML=`<b>${h.length} matches</b>${topArea?` · selalu kawasan ${topArea}`:''}`;
}

/* ════ INIT ════ */
document.getElementById('spMoment').innerHTML=
  `${M.label} — ${M.isWeekend?'hujung minggu':'hari biasa'}. <b>Lapar ke?</b>`;
updateDietUI();
if(!localStorage.getItem(DIET_KEY)){localStorage.setItem(DIET_KEY,'halal');track('diet_mode_set',{mode:'halal'});}
incVisit();
updateSplashTeaser();
checkFeedbackPrompt();
document.getElementById('spProfileLink').addEventListener('click',e=>{e.stopPropagation();renderProfile();go('profile');});
document.getElementById('pfBack').addEventListener('click',()=>go('splash'));
document.getElementById('splash').addEventListener('click',()=>{
  if(document.getElementById('sedapBanner').classList.contains('visible'))return;
  track('quiz_start');go('quiz');answers={};qIdx=0;renderQ(0);
});
document.getElementById('spBtn').addEventListener('click',e=>{
  e.stopPropagation();track('quiz_start');go('quiz');answers={};qIdx=0;renderQ(0);
});
</script>
